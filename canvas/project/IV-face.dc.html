<div style="position: absolute; left: 56px; top: 28px; width: 420px; margin: 0; font-family: 'EB Garamond', serif; font-size: 14px; line-height: 18px; color: #1c1813"><p style="margin: 0"><span style="font-variant: small-caps; letter-spacing: 0.04em">Clavicula Matricis</span></p></div>

<div style="position: absolute; left: 60px; top: 110px; width: 880px; margin: 0; font-family: 'EB Garamond', serif; font-size: 42px; line-height: 48px; color: #1c1813; text-align: center"><p style="margin: 0">Of the Second Copy</p></div>
<div style="position: absolute; left: 200px; top: 196px; width: 600px; margin: 0; font-family: 'IM Fell English', serif; font-size: 24px; line-height: 33.1px; color: #1c1813; text-align: center; letter-spacing: 0.01em"><p style="margin: 0">Two copies. One omission.</p></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":1600}}'>
class Component extends DCLogic {
renderVals() {
const lifted = !!(this.state && this.state.lifted);
return { lifted: lifted, closed: !lifted, toggle: () => this.setState({ lifted: !lifted }) };
}
}
</script>
